[project]
name = "incident-triage-agent-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pushp", email = "pushp.hans.official@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-google-genai>=3.2.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.14",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.4",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
incident-triage-agent-api = "incident_triage_agent_api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
